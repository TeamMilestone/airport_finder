[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "superwings-spinel"
version = "0.1.1"
description = "The superwings API (nearest airport from lat, lng), compiled from Ruby by Spinel."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["airport", "geolocation", "gis", "spinel", "ruby"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Ruby",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Repository = "https://github.com/TeamMilestone/airport_finder"

[tool.setuptools]
packages = ["superwings_spinel"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
